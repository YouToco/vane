# Vane 配置结构（Viper）。环境变量前缀 VANE_，嵌套用下划线：
# 如 VANE_LLM_API_KEY 覆盖 llm.api_key，VANE_DB_URL 覆盖 db.url。
# 敏感值一律走环境变量（/opt/vane/.env），本文件不放密钥。

server:
  # 只绑本机 loopback：生产由 Caddy(host 网络)反代 127.0.0.1:8080，8080 不对公网暴露。
  # 确需对外监听改 "0.0.0.0:8080" 或用 VANE_SERVER_ADDR 覆盖（记得同时收好防火墙）。
  addr: "127.0.0.1:8080"

research_gateway:
  socket_path: "/run/vane-research-gateway/gateway.sock"

db:
  url: "" # VANE_DB_URL
  # V3 专用非 owner LOGIN；留空会安全禁用 V3，不影响旧任务。
  research_runtime_url: "" # VANE_DB_RESEARCH_RUNTIME_URL
  # 独立 V3 编辑恢复 LOGIN；生产从 systemd credential 读取，不与研究执行凭证复用。
  native_v3_edit_recovery_runtime_url: "" # VANE_DB_NATIVE_V3_EDIT_RECOVERY_RUNTIME_URL
  # V3 控制面专用 vane_server_runtime LOGIN；不得使用 owner 或 executor URL。
  research_control_url: "" # VANE_DB_RESEARCH_CONTROL_URL

temporal:
  host: "127.0.0.1:7233"
  namespace: "default"
  task_queue: "vane-push"

llm:
  provider: "deepseek"
  base_url: "https://api.deepseek.com"
  api_key: "" # VANE_LLM_API_KEY
  model: "deepseek-v4-flash"       # pipeline 打分/出卡（便宜档）
  # 三项均为空时 Agent 沿用上方 endpoint/key；切供应商时三项必须同时设置。
  agent_provider: ""
  agent_base_url: ""
  agent_api_key: "" # VANE_LLM_AGENT_API_KEY
  agent_model: "deepseek-v4-flash" # Agent/DeepDive/A2A：thinking/high 性价比档
  # V3 planner/synthesis/verifier/corrector 统一走 flash；必须有有效价格规则。
  research_model: "deepseek-v4-flash"
  max_concurrent: 32            # 实测定值：45 条批次 5 并发 5.7s → 32 并发 1.25s（v4-flash 官方限额 2500）
  # endpoint/key 任一变更时必须分别递增；旧代未保留则旧 run 安全失败，禁止复用代号。
  compiled_endpoint_generation: 1
  compiled_credential_generation: 1

# 注：飞书凭证不在配置文件——由 Dashboard 向导写入 settings 表，运行时从 store 读取。

fetch:
  tikhub_api_key: "" # VANE_FETCH_TIKHUB_API_KEY
  exa_api_key: ""    # VANE_FETCH_EXA_API_KEY
  # 任一 provider key/endpoint 变更时递增；旧代未保留则旧 run 安全失败。
  compiled_exa_credential_generation: 1
  compiled_tikhub_credential_generation: 1
  timeout_seconds: 20
  max_response_mb: 5

pipeline:
  # 任务手册 prompt 灰度：false=关闭；true + 非空 ID=仅该任务 canary；
  # true + 空 ID + allow_all=true=全量开启（第二把钥匙防漏配 canary 时误放量）。
  playbook_prompts_enabled: false
  playbook_prompt_canary_schedule_id: ""
  playbook_prompts_allow_all: false
  # C1b compiled runtime 同样先单任务 canary；全量需显式 allow_all。
  compiled_runtime_enabled: false
  compiled_runtime_canary_schedule_id: ""
  compiled_runtime_allow_all: false
  # Source-free Tool runtime is deliberately single-task only. To roll back:
  # pause the task first, then clear this ID (V2 definitions cannot run on V1).
  tool_runtime_canary_schedule_id: ""
  # Shadow/cutover controls remain exact-task only. Once cut over, formal V3
  # runs are authorized by each task's enabled database authority token.
  research_v3_shadow_canary_schedule_id: ""
  research_v3_authority_canary_schedule_id: ""
  # Required by the unconditional Owner Agent manage_tasks create surface.
  # Process capability only; it never grants task authority by itself.
  research_v3_runtime_enabled: true
  # P1-B exact-run lifecycle is independent and remains dark by default.
  run_outcome_enabled: false
  run_outcome_canary_schedule_id: ""
  run_outcome_allow_all: false
  # P1-C canonical Brief writer is nested inside RunOutcome and defaults off.
  canonical_brief_enabled: false
  canonical_brief_canary_schedule_id: ""
  canonical_brief_allow_all: false
  # Phase 2-A structured CardGen is nested inside canonical Brief.
  structured_insight_enabled: false
  structured_insight_canary_schedule_id: ""
  structured_insight_allow_all: false
  # Independent Phase 2-A reader/renderer authority. Initial canary must match
  # the exact P1-E canonical renderer task.
  structured_insight_renderer_enabled: false
  structured_insight_renderer_canary_schedule_id: ""
  structured_insight_renderer_allow_all: false
  # P2-B1 verified multi-source event evidence is exact-task only.
  structured_event_evidence_enabled: false
  structured_event_evidence_canary_schedule_id: ""
  structured_event_evidence_allow_all: false
  # P2-D executive synthesis is nested inside structured event evidence.
  executive_brief_enabled: false
  executive_brief_canary_schedule_id: ""
  executive_brief_allow_all: false
  executive_brief_web_canary_schedule_id: ""
  executive_brief_web_projection_allow_all: false
  executive_brief_renderer_canary_schedule_id: ""
  # P1-E Feishu renderer authority; empty is the exact rollback state.
  canonical_brief_renderer_canary_schedule_id: ""
  # C2c-2: exact one-task shadow canary. Empty means fully off.
  snapshot_v2_shadow_canary_schedule_id: ""
  snapshot_v2_read_audit_canary_schedule_id: ""
  # Observation policy rollout is exact-task only. Authority must equal shadow.
  observation_shadow_canary_schedule_id: ""
  observation_authority_canary_schedule_id: ""
  # Durable provider effect: exact one-task compiled canary only.
  push_effect_canary_schedule_id: ""
  # Independent exact-task recovery canary. Research V3 authority must bind
  # this to the same task so startup recovery precedes worker/Feishu ingress.
  push_effect_recovery_canary_schedule_id: ""

agent:
  max_turns: 20
  # C2b3-2d 唯一任务定义编辑入口；真卡 Gate 与耐久回执接通前保持 false。
  session_ttl_minutes: 30 # 同一 owner 会话闲置过期窗口（M4）

log:
  level: "info"

dashboard:
  password: "" # VANE_DASHBOARD_PASSWORD（为空则 Dashboard 登录不可用，只告警不拒启动）

a2a:
  enabled: false # 默认关闭：不 Mount，/a2a 与 agent-card 均 404（a2a-contract §6/§7）
  token: ""      # VANE_A2A_TOKEN（本体存 my-credentials；为空则挂载但 auth 恒 401，只告警不拒启动）
  base_url: "https://api.vane.zhuoqidev.com/a2a" # 进 AgentCard supportedInterfaces

# Telegram Bot 私聊入口。默认关闭；token/secret 只走环境变量或 systemd credential，
# 不写入本文件。启用时服务会用 getMe 校验 bot identity，并核对 exact webhook。
telegram:
  enabled: false
  bot_token: ""       # VANE_TELEGRAM_BOT_TOKEN / telegram_bot_token credential
  webhook_secret: ""  # VANE_TELEGRAM_WEBHOOK_SECRET / telegram_webhook_secret credential
  webhook_url: "https://api.vane.zhuoqidev.com/telegram/webhook"
  api_base_url: "https://api.telegram.org"
  workers: 1

# Provider credentials are encrypted in PostgreSQL. Only this AES-256 keyring
# stays in deployment state; it is never writable or readable through Web.
credential_vault:
  active_key_id: ""   # e.g. vault-key-1 (non-secret identifier)
  active_key_hex: ""  # VANE_CREDENTIAL_VAULT_ACTIVE_KEY_HEX / systemd credential
  retired_keys: ""    # optional decrypt-only: old-id=64hex,older-id=64hex
