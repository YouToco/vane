name: Store race sharding experiment

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOSUMDB: sum.golang.org

concurrency:
  group: store-race-sharding-${{ github.repository }}
  cancel-in-progress: false

jobs:
  seed:
    name: Generate stable timing seed
    runs-on: ubuntu-24.04
    outputs:
      seed_sha256: ${{ steps.seed_digest.outputs.seed_sha256 }}
      test_list_sha256: ${{ steps.seed_digest.outputs.test_list_sha256 }}

    services:
      postgres_0:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_1:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_2:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run stable store race shards
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/storetestshard run \
            --artifacts tmp/store-seed \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_0.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_1.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_2.ports['5432'] }}/vane_test?sslmode=disable'

      - name: Generate and verify canonical timing seed
        id: seed_digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/store-timing-seed
          cp tmp/store-seed/store-tests.list.txt tmp/store-timing-seed/store-tests.list.txt
          go run ./cmd/storetestshard timing-seed \
            --tests tmp/store-timing-seed/store-tests.list.txt \
            --output tmp/store-timing-seed/store.timings.jsonl \
            --manifest tmp/store-timing-seed/store.timings.manifest.json \
            tmp/store-seed/store.test.json
          (
            cd tmp/store-timing-seed
            sha256sum store.timings.jsonl store-tests.list.txt > store-timing-seed.sha256
            sha256sum --check store-timing-seed.sha256
          )
          seed_digest="$(sha256sum tmp/store-timing-seed/store.timings.jsonl | cut -d' ' -f1)"
          test_list_digest="$(sha256sum tmp/store-timing-seed/store-tests.list.txt | cut -d' ' -f1)"
          echo "seed_sha256=${seed_digest}" >> "${GITHUB_OUTPUT}"
          echo "test_list_sha256=${test_list_digest}" >> "${GITHUB_OUTPUT}"
          jq -e --arg digest "${seed_digest}" \
            '.version == 1 and .test_count > 0 and
             .terminal_events == .test_count and .sha256 == $digest' \
            tmp/store-timing-seed/store.timings.manifest.json

      - name: Upload timing seed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-race-timing-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/store-timing-seed/
          if-no-files-found: error
          retention-days: 14

      - name: Upload stable seed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-race-seed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/store-seed/
          if-no-files-found: warn
          retention-days: 14

  lpt:
    name: Historical LPT repeat ${{ matrix.repeat }}
    needs: seed
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4, 5]

    services:
      postgres_0:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_1:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_2:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Download timing seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-race-timing-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/store-timing-seed

      - name: Revalidate timing seed
        shell: bash
        run: |
          set -euo pipefail
          (
            cd tmp/store-timing-seed
            sha256sum --check store-timing-seed.sha256
          )
          seed_digest="$(sha256sum tmp/store-timing-seed/store.timings.jsonl | cut -d' ' -f1)"
          test_list_digest="$(sha256sum tmp/store-timing-seed/store-tests.list.txt | cut -d' ' -f1)"
          [[ "${seed_digest}" == "${{ needs.seed.outputs.seed_sha256 }}" ]]
          [[ "${test_list_digest}" == "${{ needs.seed.outputs.test_list_sha256 }}" ]]
          jq -e --arg digest "${seed_digest}" \
            '.version == 1 and .test_count > 0 and
             .terminal_events == .test_count and .sha256 == $digest' \
            tmp/store-timing-seed/store.timings.manifest.json
          go run ./cmd/storetestshard timing-seed \
            --tests tmp/store-timing-seed/store-tests.list.txt \
            tmp/store-timing-seed/store.timings.jsonl

      - name: Run historical LPT store race shards
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/storetestshard run \
            --artifacts tmp/store-lpt-${{ matrix.repeat }} \
            --timings tmp/store-timing-seed/store.timings.jsonl \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_0.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_1.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_2.ports['5432'] }}/vane_test?sslmode=disable'

      - name: Verify LPT strategy and integrity
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .exit_code == 0 and .phase == "complete" and
            .strategy == "historical-lpt" and .timing_input_status == "loaded" and
            .expected_tests > 0 and .historical_timing_tests == .expected_tests and
            .observed_tests == .expected_tests and
            .duplicate_tests == 0 and .missing_tests == 0 and
            (.shard_seconds | length) == 3
          ' tmp/store-lpt-${{ matrix.repeat }}/store-shard-status.json
          jq -e '
            .strategy == "historical-lpt" and
            .historical_timings == .test_count and
            (.shards | length) == 3
          ' tmp/store-lpt-${{ matrix.repeat }}/store-shard-plan.json

      - name: Upload LPT evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-race-lpt-${{ github.run_id }}-${{ github.run_attempt }}-repeat-${{ matrix.repeat }}
          path: tmp/store-lpt-${{ matrix.repeat }}/
          if-no-files-found: warn
          retention-days: 14
