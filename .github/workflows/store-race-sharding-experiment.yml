name: Store race sharding experiment

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOSUMDB: sum.golang.org

concurrency:
  group: store-race-sharding-${{ github.repository }}
  cancel-in-progress: false

jobs:
  seed:
    name: Generate stable timing seed
    runs-on: ubuntu-24.04
    outputs:
      seed_gzip_base64: ${{ steps.seed_digest.outputs.seed_gzip_base64 }}
      seed_payload_bytes: ${{ steps.seed_digest.outputs.seed_payload_bytes }}
      seed_sha256: ${{ steps.seed_digest.outputs.seed_sha256 }}
      source_commit: ${{ steps.seed_digest.outputs.source_commit }}

    services:
      postgres_0:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_1:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_2:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run stable store race shards
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/storetestshard run \
            --artifacts tmp/store-seed \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_0.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_1.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_2.ports['5432'] }}/vane_test?sslmode=disable'

      - name: Generate and verify canonical timing seed
        id: seed_digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/store-timing-seed
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          jq -e '
            .exit_code == 0 and .phase == "complete" and
            .strategy == "stable-fnv1a" and .timing_input_status == "not_provided" and
            .expected_tests == 880 and .observed_tests == 880 and
            .historical_timing_tests == 0 and
            .duplicate_tests == 0 and .missing_tests == 0 and
            (.shard_seconds | length) == 3
          ' tmp/store-seed/store-shard-status.json
          jq -e '
            .strategy == "stable-fnv1a" and
            .test_count == 880 and .historical_timings == 0 and
            (.shards | length) == 3
          ' tmp/store-seed/store-shard-plan.json
          go run ./cmd/storetestshard timing-seed \
            --tests tmp/store-seed/store-tests.list.txt \
            --output tmp/store-timing-seed/store.timings.jsonl \
            --manifest tmp/store-timing-seed/store.timings.manifest.json \
            tmp/store-seed/store.test.json
          seed_digest="$(sha256sum tmp/store-timing-seed/store.timings.jsonl | cut -d' ' -f1)"
          gzip -n -9 -c tmp/store-timing-seed/store.timings.jsonl > tmp/store-timing-seed/store.timings.jsonl.gz
          seed_gzip_base64="$(base64 -w0 tmp/store-timing-seed/store.timings.jsonl.gz)"
          seed_payload_bytes="${#seed_gzip_base64}"
          (( seed_payload_bytes > 0 && seed_payload_bytes <= 262144 ))
          echo "seed_gzip_base64=${seed_gzip_base64}" >> "${GITHUB_OUTPUT}"
          echo "seed_payload_bytes=${seed_payload_bytes}" >> "${GITHUB_OUTPUT}"
          echo "seed_sha256=${seed_digest}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          jq -e --arg digest "${seed_digest}" \
            '.version == 1 and .test_count == 880 and
             .terminal_events == 880 and .zero_duration_tests >= 0 and
             .sha256 == $digest' \
            tmp/store-timing-seed/store.timings.manifest.json

      - name: Print canonical seed evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for evidence in \
            tmp/store-seed/store-shard-status.json \
            tmp/store-seed/store-shard-plan.json \
            tmp/store-timing-seed/store.timings.manifest.json; do
            [[ -f "${evidence}" ]] || continue
            jq -cS . "${evidence}"
          done

  lpt:
    name: Historical LPT repeat ${{ matrix.repeat }}
    needs: seed
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4, 5]

    services:
      postgres_0:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_1:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_2:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Decode and revalidate timing seed
        shell: bash
        env:
          SEED_GZIP_BASE64: ${{ needs.seed.outputs.seed_gzip_base64 }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "${{ needs.seed.outputs.source_commit }}" == "${GITHUB_SHA}" ]]
          payload_bytes="${#SEED_GZIP_BASE64}"
          [[ "${payload_bytes}" == "${{ needs.seed.outputs.seed_payload_bytes }}" ]]
          (( payload_bytes > 0 && payload_bytes <= 262144 ))
          mkdir -p tmp/store-timing-seed
          printf '%s' "${SEED_GZIP_BASE64}" | base64 --decode > tmp/store-timing-seed/store.timings.jsonl.gz
          gzip --test tmp/store-timing-seed/store.timings.jsonl.gz
          gzip --decompress --stdout tmp/store-timing-seed/store.timings.jsonl.gz > tmp/store-timing-seed/store.timings.jsonl
          seed_digest="$(sha256sum tmp/store-timing-seed/store.timings.jsonl | cut -d' ' -f1)"
          [[ "${seed_digest}" == "${{ needs.seed.outputs.seed_sha256 }}" ]]
          [[ "$(wc -l < tmp/store-timing-seed/store.timings.jsonl | tr -d ' ')" == "880" ]]

      - name: Run historical LPT store race shards
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/storetestshard run \
            --artifacts tmp/store-lpt-${{ matrix.repeat }} \
            --timings tmp/store-timing-seed/store.timings.jsonl \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_0.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_1.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_2.ports['5432'] }}/vane_test?sslmode=disable'

      - name: Verify LPT strategy and integrity
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .exit_code == 0 and .phase == "complete" and
            .strategy == "historical-lpt" and .timing_input_status == "loaded" and
            .expected_tests == 880 and .historical_timing_tests == 880 and
            .observed_tests == 880 and
            .duplicate_tests == 0 and .missing_tests == 0 and
            (.shard_seconds | length) == 3
          ' tmp/store-lpt-${{ matrix.repeat }}/store-shard-status.json
          jq -e '
            .strategy == "historical-lpt" and
            .test_count == 880 and .historical_timings == 880 and
            (.shards | length) == 3
          ' tmp/store-lpt-${{ matrix.repeat }}/store-shard-plan.json

      - name: Print canonical LPT evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for evidence in \
            tmp/store-lpt-${{ matrix.repeat }}/store-shard-status.json \
            tmp/store-lpt-${{ matrix.repeat }}/store-shard-plan.json; do
            [[ -f "${evidence}" ]] || continue
            jq -cS . "${evidence}"
          done
