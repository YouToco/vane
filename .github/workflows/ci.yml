name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOSUMDB: sum.golang.org
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store-race:
    runs-on: [self-hosted, Linux, ARM64]

    services:
      postgres_0:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_1:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_2:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select pinned runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          go_root="${RUNNER_TOOL_CACHE}/go/1.26.6/arm64"
          go_binary="${go_root}/bin/go"
          [[ -x "${go_binary}" ]]
          [[ "$("${go_binary}" version)" == "go version go1.26.6 linux/arm64" ]]
          echo "GOROOT=${go_root}" >> "${GITHUB_ENV}"
          echo "${go_root}/bin" >> "${GITHUB_PATH}"

      - name: Select trusted store timing cache
        id: store-timing-key
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          trusted_sha=""
          case "${EVENT_NAME}" in
            pull_request)
              trusted_sha="${PULL_REQUEST_BASE_SHA}"
              ;;
            push)
              trusted_sha="${PUSH_BEFORE_SHA}"
              ;;
          esac
          if [[ "${trusted_sha}" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "${trusted_sha}" != "0000000000000000000000000000000000000000" ]]; then
            echo "key=store-race-timings-v1-${trusted_sha}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Restore trusted runner-local store timings
        if: steps.store-timing-key.outputs.key != ''
        continue-on-error: true
        shell: bash
        env:
          TIMING_KEY: ${{ steps.store-timing-key.outputs.key }}
        run: |
          set -euo pipefail
          source_root="${RUNNER_TOOL_CACHE}/vane/store-race-timings-v1"
          source_file="${source_root}/${TIMING_KEY}/store.timings.jsonl"
          rm -rf tmp/store-timing-cache
          if [[ -f "${source_file}" && ! -L "${source_file}" ]]; then
            resolved_source="$(realpath "${source_file}")"
            resolved_root="$(realpath "${source_root}")"
            [[ "${resolved_source}" == "${resolved_root}"/* ]]
            mkdir -p tmp/store-timing-cache
            install -m 0644 "${resolved_source}" \
              tmp/store-timing-cache/store.timings.jsonl
          fi

      - name: Run store race shards
        shell: bash
        run: |
          set -euo pipefail
          status=0
          go run ./cmd/storetestshard run \
            --artifacts tmp/store-sharding \
            --timings tmp/store-timing-cache/store.timings.jsonl \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_0.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_1.ports['5432'] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_2.ports['5432'] }}/vane_test?sslmode=disable' || status=$?
          if (( status != 0 )); then
            for log in tmp/store-sharding/store-shard-*.test.json; do
              [[ -f "${log}" ]] || continue
              echo "::group::$(basename "${log}") failures"
              mapfile -t failed_tests < <(
                jq -r 'select(.Action == "fail" and .Test != null) | .Test' "${log}" |
                  sort -u
              )
              if (( ${#failed_tests[@]} == 0 )); then
                jq -r 'select(.Action == "output") | .Output' "${log}" | tail -n 300
              else
                for failed_test in "${failed_tests[@]}"; do
                  printf '\nFAIL %s\n' "${failed_test}"
                  jq -r --arg test "${failed_test}" \
                    'select(.Action == "output" and .Test == $test) | .Output' "${log}"
                done
              fi
              echo "::endgroup::"
            done
          fi
          exit "${status}"

      - name: Build current main store timing seed
        id: store-timing-seed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # The runner-local cache copies only this validated canonical seed;
          # PR runs never publish timing data back into the trusted namespace.
          mkdir -p tmp/store-timing-cache
          go run ./cmd/storetestshard timing-seed \
            --tests tmp/store-sharding/store-tests.list.txt \
            --output tmp/store-timing-cache/store.timings.jsonl \
            --manifest tmp/store-timing-cache/store.timings.manifest.json \
            tmp/store-sharding/store-shard-0.test.json \
            tmp/store-sharding/store-shard-1.test.json \
            tmp/store-sharding/store-shard-2.test.json
          jq -e \
            --argjson expected "$(jq -r '.expected_tests' tmp/store-sharding/store-shard-status.json)" \
            '.version == 1 and .test_count == $expected and
             .terminal_events == $expected and
             (.zero_duration_tests | type == "number")' \
            tmp/store-timing-cache/store.timings.manifest.json >/dev/null
          go run ./cmd/storetestshard timing-seed \
            --tests tmp/store-sharding/store-tests.list.txt \
            tmp/store-timing-cache/store.timings.jsonl >/dev/null

      - name: Save current main store timings locally
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.store-timing-seed.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target_root="${RUNNER_TOOL_CACHE}/vane/store-race-timings-v1"
          target_dir="${target_root}/store-race-timings-v1-${GITHUB_SHA}"
          mkdir -p "${target_dir}"
          temp_file="$(mktemp "${target_dir}/.store.timings.XXXXXX")"
          trap 'rm -f "${temp_file}"' EXIT
          install -m 0644 tmp/store-timing-cache/store.timings.jsonl "${temp_file}"
          mv -f "${temp_file}" "${target_dir}/store.timings.jsonl"

  rest:
    runs-on: [self-hosted, Linux, ARM64]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select pinned runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          go_root="${RUNNER_TOOL_CACHE}/go/1.26.6/arm64"
          go_binary="${go_root}/bin/go"
          temporal_binary="${RUNNER_TOOL_CACHE}/temporal/1.8.2/arm64/temporal"
          [[ -x "${go_binary}" ]]
          [[ "$("${go_binary}" version)" == "go version go1.26.6 linux/arm64" ]]
          [[ -x "${temporal_binary}" ]]
          [[ "$("${temporal_binary}" --version)" == "temporal version 1.8.2"* ]]
          echo "GOROOT=${go_root}" >> "${GITHUB_ENV}"
          echo "VANE_TEMPORAL_CLI_PATH=${temporal_binary}" >> "${GITHUB_ENV}"
          echo "${go_root}/bin" >> "${GITHUB_PATH}"

      - name: Download dependencies
        run: go mod download

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Temporal retention witness integration
        run: go test -tags=integration ./internal/agentfirstaudit -run '^TestRetentionClockEvidenceRealTemporalHistory$' -count=1

      - name: Vet
        run: go vet ./...

      - name: Verify agent tool inventory
        run: go run ./cmd/agenttoolinventory -check

      - name: Test remaining packages
        shell: bash
        env:
          DATABASE_URL: postgres://vane:vane_test@localhost:${{ job.services.postgres.ports['5432'] }}/vane_test?sslmode=disable
        run: |
          set -euo pipefail
          store_package="$(go list ./store)"
          mapfile -t packages < <(go list ./... | grep -Fvx "${store_package}")
          go test -race -p=1 -parallel=1 -covermode=atomic \
            -coverprofile=non-store.coverage.out \
            "${packages[@]}"

      - name: True Temporal termination with PostgreSQL recovery
        run: >-
          go test -tags=integration ./periodicbrief
          -run TestPeriodicWorkflowExternalTerminationReplaysAndRecoveryConverges
          -count=1
        env:
          DATABASE_URL: postgres://vane:vane_test@localhost:${{ job.services.postgres.ports['5432'] }}/vane_test?sslmode=disable

      - name: Build
        run: |
          go build -o bin/vane ./cmd/server
          go build -o bin/vane-research-prepare ./cmd/researchprepare
