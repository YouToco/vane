name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
        env:
          DATABASE_URL: postgres://vane:vane_test@localhost:5432/vane_test?sslmode=disable

      - name: Build
        run: go build -o bin/vane ./cmd/server

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build linux binary
        run: GOOS=linux GOARCH=amd64 go build -o bin/vane ./cmd/server
        env:
          CGO_ENABLED: "0"

      - name: Prepare directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/vane/bin

      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bin/vane"
          target: "/opt/vane/"

      # 基础设施文件（Caddyfile / compose / systemd unit / dynamicconfig）随代码同步。
      # 缺这步会导致：改了 Caddyfile 或 compose 后 VPS 仍跑旧配置——M2 前端 404 即因此
      # （前端产物已就位但 Caddy 未挂 web 卷、Caddyfile 未更新）。strip_components 去掉 deploy/ 前缀。
      - name: Upload infra files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/Caddyfile,deploy/docker-compose.yml,deploy/vane.service,deploy/dynamicconfig/development-sql.yaml"
          target: "/opt/vane/"
          strip_components: 1

      - name: Apply infra changes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cp /opt/vane/vane.service /etc/systemd/system/vane.service
            systemctl daemon-reload
            # compose 幂等：service 定义或卷有变更才重建，无变更是 no-op
            cd /opt/vane && docker compose up -d
            # Caddyfile 是 bind mount，改内容不触发容器重建，需显式 reload
            docker exec -w /etc/caddy vane-caddy-1 caddy reload || docker restart vane-caddy-1

      - name: Restart and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod +x /opt/vane/bin/vane
            systemctl restart vane
            # Type=simple 下 restart 立即返回，必须主动验证：
            # 迁移失败/配置缺失会崩溃重启循环，没有这步 CI 会假绿。
            sleep 5
            systemctl is-active vane
            curl -fsS --max-time 5 http://127.0.0.1:8080/readyz
            echo "deploy verified: readyz OK"
