name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOSUMDB: sum.golang.org

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store-race:
    runs-on: ubuntu-24.04

    services:
      postgres_0:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_1:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres_2:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Select trusted store timing cache
        id: store-timing-key
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          trusted_sha=""
          case "${EVENT_NAME}" in
            pull_request)
              trusted_sha="${PULL_REQUEST_BASE_SHA}"
              ;;
            push)
              trusted_sha="${PUSH_BEFORE_SHA}"
              ;;
          esac
          if [[ "${trusted_sha}" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "${trusted_sha}" != "0000000000000000000000000000000000000000" ]]; then
            echo "key=store-race-timings-v1-${trusted_sha}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Restore trusted store timings
        if: steps.store-timing-key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tmp/store-timing-cache
          key: ${{ steps.store-timing-key.outputs.key }}
          fail-on-cache-miss: false

      - name: Run store race shards
        shell: bash
        run: |
          set -euo pipefail
          status=0
          go run ./cmd/storetestshard run \
            --artifacts tmp/store-sharding \
            --timings tmp/store-timing-cache/store.timings.jsonl \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_0.ports[5432] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_1.ports[5432] }}/vane_test?sslmode=disable' \
            --database-url 'postgres://vane:vane_test@localhost:${{ job.services.postgres_2.ports[5432] }}/vane_test?sslmode=disable' || status=$?
          if (( status != 0 )); then
            for log in tmp/store-sharding/store-shard-*.test.json; do
              [[ -f "${log}" ]] || continue
              echo "::group::$(basename "${log}") failures"
              mapfile -t failed_tests < <(
                jq -r 'select(.Action == "fail" and .Test != null) | .Test' "${log}" |
                  sort -u
              )
              if (( ${#failed_tests[@]} == 0 )); then
                jq -r 'select(.Action == "output") | .Output' "${log}" | tail -n 300
              else
                for failed_test in "${failed_tests[@]}"; do
                  printf '\nFAIL %s\n' "${failed_test}"
                  jq -r --arg test "${failed_test}" \
                    'select(.Action == "output" and .Test == $test) | .Output' "${log}"
                done
              fi
              echo "::endgroup::"
            done
          fi
          exit "${status}"

      - name: Build current main store timing seed
        id: store-timing-seed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/store-timing-cache-next
          go run ./cmd/storetestshard timing-seed \
            --tests tmp/store-sharding/store-tests.list.txt \
            --output tmp/store-timing-cache-next/store.timings.jsonl \
            --manifest tmp/store-timing-cache-next/store.timings.manifest.json \
            tmp/store-sharding/store-shard-0.test.json \
            tmp/store-sharding/store-shard-1.test.json \
            tmp/store-sharding/store-shard-2.test.json
          jq -e \
            --argjson expected "$(jq -r '.expected_tests' tmp/store-sharding/store-shard-status.json)" \
            '.version == 1 and .test_count == $expected and
             .terminal_events == $expected and
             (.zero_duration_tests | type == "number")' \
            tmp/store-timing-cache-next/store.timings.manifest.json >/dev/null
          go run ./cmd/storetestshard timing-seed \
            --tests tmp/store-sharding/store-tests.list.txt \
            tmp/store-timing-cache-next/store.timings.jsonl >/dev/null

      - name: Save current main store timings
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.store-timing-seed.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tmp/store-timing-cache-next
          key: store-race-timings-v1-${{ github.sha }}

  rest:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U vane -d vane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Vet
        run: go vet ./...

      - name: Verify agent tool inventory
        run: go run ./cmd/agenttoolinventory -check

      - name: Test remaining packages
        shell: bash
        env:
          DATABASE_URL: postgres://vane:vane_test@localhost:${{ job.services.postgres.ports[5432] }}/vane_test?sslmode=disable
        run: |
          set -euo pipefail
          store_package="$(go list ./store)"
          mapfile -t packages < <(go list ./... | grep -Fvx "${store_package}")
          go test -race -p=1 -parallel=1 -covermode=atomic \
            -coverprofile=non-store.coverage.out \
            "${packages[@]}"

      - name: True Temporal termination with PostgreSQL recovery
        run: >-
          go test -tags=integration ./periodicbrief
          -run TestPeriodicWorkflowExternalTerminationReplaysAndRecoveryConverges
          -count=1
        env:
          DATABASE_URL: postgres://vane:vane_test@localhost:${{ job.services.postgres.ports[5432] }}/vane_test?sslmode=disable

      - name: Build
        run: |
          go build -o bin/vane ./cmd/server
          go build -o bin/vane-research-prepare ./cmd/researchprepare

  test:
    needs: [store-race, rest]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm required CI jobs
        run: echo "store race and remaining package gates passed"
