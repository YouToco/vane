name: CI

# Pipeline:
#   1. test: server (go -race), web (vitest + node tests), cross-component contracts
#   2. build: (main/dispatch only, parallel with test) compile the release payload once
#   3. deploy: (main/dispatch only, needs test AND build) publish the exact tested
#      artifact to production behind the "production" environment approval gate:
#      atomic server release over SSH (CAS -> migrate -> switch -> verify -> rollback),
#      then web publication to Cloudflare Pages and OSS + Ali CDN.
#
# Required repository secrets (consumed only by the deploy job):
#   VANE_DEPLOY_KEY          ssh-ed25519 private key authorized on the VPS
#   VANE_DEPLOY_KNOWN_HOSTS  known_hosts line(s) pinning the VPS host key
#   ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET   (OSS + CDN, cn-shenzhen)
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID       (Pages project vane-web)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test, build, and deploy (defaults to main)
        required: false
        default: main

permissions:
  contents: read

env:
  VANE_TOOL_CACHE: ${{ github.workspace }}/.vane/tool-cache

jobs:
  test:
    name: Tests (server/web/contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Provision locked toolchain (go, node)
        run: |
          mkdir -p "$VANE_TOOL_CACHE"
          python3 tools/install/locked_tool.py go --lock tools/toolchain.lock.json --cache "$VANE_TOOL_CACHE"
          python3 tools/install/locked_tool.py node --lock tools/toolchain.lock.json --cache "$VANE_TOOL_CACHE"
          lock="$GITHUB_WORKSPACE/tools/toolchain.lock.json"
          gover=$(python3 -c "import json;print(json.load(open('$lock'))['tools']['go']['version'])")
          nodever=$(python3 -c "import json;print(json.load(open('$lock'))['tools']['node']['version'])")
          echo "$VANE_TOOL_CACHE/go/$gover/bin" >> "$GITHUB_PATH"
          echo "$VANE_TOOL_CACHE/node/$nodever/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: |
          make test-server
          npm ci --prefix web
          make test-web
          make test-contract

  build:
    name: Build release payload (build once)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Provision locked toolchain (go, node)
        run: |
          mkdir -p "$VANE_TOOL_CACHE"
          python3 tools/install/locked_tool.py go --lock tools/toolchain.lock.json --cache "$VANE_TOOL_CACHE"
          python3 tools/install/locked_tool.py node --lock tools/toolchain.lock.json --cache "$VANE_TOOL_CACHE"
          lock="$GITHUB_WORKSPACE/tools/toolchain.lock.json"
          gover=$(python3 -c "import json;print(json.load(open('$lock'))['tools']['go']['version'])")
          nodever=$(python3 -c "import json;print(json.load(open('$lock'))['tools']['node']['version'])")
          echo "$VANE_TOOL_CACHE/go/$gover/bin" >> "$GITHUB_PATH"
          echo "$VANE_TOOL_CACHE/node/$nodever/bin" >> "$GITHUB_PATH"

      - name: Build server binaries (linux-amd64)
        run: make build-server

      - name: Build web dist
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Upload release payload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload
          retention-days: 7
          path: |
            server/bin/
            web/dist/

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request'
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Approval gate: the production environment requires a required reviewer and
    # is restricted to the main branch (configured in repository settings).
    environment: production
    concurrency:
      group: vane-deploy
      cancel-in-progress: false
    env:
      VANE_TOOL_CACHE: ${{ github.workspace }}/.vane/tool-cache
      VANE_WORK_ROOT: ${{ github.workspace }}/.vane/work
      VPS_HOST: 188.253.125.238
      VPS_PORT: "10058"
      OSS_BUCKET: zhuoqidev-vane-web
      CDN_DOMAIN: vane.zhuoqidev.com
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact revision
        run: |
          sha=$(git rev-parse HEAD)
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Provision locked toolchain (node)
        run: |
          mkdir -p "$VANE_TOOL_CACHE"
          python3 tools/install/locked_tool.py node --lock tools/toolchain.lock.json --cache "$VANE_TOOL_CACHE"
          lock="$GITHUB_WORKSPACE/tools/toolchain.lock.json"
          nodever=$(python3 -c "import json;print(json.load(open('$lock'))['tools']['node']['version'])")
          echo "$VANE_TOOL_CACHE/node/$nodever/bin" >> "$GITHUB_PATH"

      - name: Download tested release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload

      - name: Assemble atomic-release payload
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/bin" "$stage/dynamicconfig"
          for binary in vane vane-research-gateway vane-migrate gate agentfirstretention; do
            install -m 0755 "server/bin/$binary" "$stage/bin/$binary"
          done
          install -m 0644 infra/production/caddy/Caddyfile "$stage/Caddyfile"
          install -m 0644 infra/production/compose/docker-compose.yml "$stage/docker-compose.yml"
          install -m 0644 infra/production/temporal/development-sql.yaml "$stage/dynamicconfig/development-sql.yaml"
          for unit in vane.service vane-research-gateway.service vane-research-gateway.socket; do
            install -m 0644 "infra/production/systemd/$unit" "$stage/$unit"
          done
          printf '%s\n' "$SHA" > "$stage/monorepo-revision"
          printf '%s\n' "{\"schema\":\"vane.release-receipt/v3\",\"revision\":\"$SHA\",\"built_by\":\"github-actions\",\"run_id\":\"$GITHUB_RUN_ID\",\"run_attempt\":$GITHUB_RUN_ATTEMPT}" > "$stage/release-receipt.json"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          VANE_DEPLOY_KEY: ${{ secrets.VANE_DEPLOY_KEY }}
          VANE_DEPLOY_KNOWN_HOSTS: ${{ secrets.VANE_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VANE_DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VANE_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -p "$VPS_PORT"
                    -o BatchMode=yes -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          echo "SSH_OPTS=${ssh_opts[*]}" >> "$GITHUB_ENV"

      - name: Upload payload and cut over (atomic, with rollback)
        run: |
          stage_name=".deploy-${SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_stage="/opt/vane/${stage_name}"
          current=$(ssh $SSH_OPTS "root@$VPS_HOST" 'if [ -L /opt/vane/current ]; then basename "$(readlink /opt/vane/current)"; else echo none; fi')
          echo "current production revision: $current"
          ssh $SSH_OPTS "root@$VPS_HOST" "mkdir -p '$remote_stage'"
          tar -C "$STAGE" -cf - . | ssh $SSH_OPTS "root@$VPS_HOST" "tar -xf - -C '$remote_stage'"
          ssh $SSH_OPTS "root@$VPS_HOST" "chmod -R go-w '$remote_stage'"
          ssh $SSH_OPTS "root@$VPS_HOST" "bash /dev/stdin '$remote_stage' '$current'" < tools/release/remote-atomic-release.sh

      - name: Install pinned web publication tools (aliyun, ossutil)
        run: |
          mkdir -p "$VANE_WORK_ROOT"
          tools/install/install-aliyun.sh
          tools/install/install-ossutil.sh
          lock="$GITHUB_WORKSPACE/tools/toolchain.lock.json"
          aliyunver=$(python3 -c "import json;print(json.load(open('$lock'))['tools']['aliyun_cli']['version'])")
          ossutilver=$(python3 -c "import json;print(json.load(open('$lock'))['tools']['ossutil']['version'])")
          echo "$VANE_TOOL_CACHE/aliyun_cli/$aliyunver" >> "$GITHUB_PATH"
          echo "$VANE_TOOL_CACHE/ossutil/$ossutilver" >> "$GITHUB_PATH"

      - name: Publish web to Aliyun OSS and refresh CDN
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          aliyun configure set --profile vane \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET" \
            --region cn-shenzhen
          ossutil cp -rf --update --region cn-shenzhen web/dist/ "oss://$OSS_BUCKET/"
          aliyun cdn RefreshObjectCaches --ObjectPath "$CDN_DOMAIN/" --ObjectType Directory

      - name: Publish web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --prefix tools/wrangler
          tools/wrangler/node_modules/.bin/wrangler pages deploy web/dist \
            --project-name vane-web --branch main --commit-dirty=true

      - name: Post-deploy verification
        run: |
          ssh $SSH_OPTS "root@$VPS_HOST" '
            set -e
            test "$(cat /opt/vane/current/monorepo-revision)" = "'"$SHA"'"
            curl --fail --silent --max-time 5 http://127.0.0.1:8080/readyz > /dev/null
            echo "server OK at '"$SHA"'"
          '
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$CDN_DOMAIN/")
            [ "$code" = 200 ] && break
            sleep 5
          done
          test "$code" = 200
          echo "web OK at https://$CDN_DOMAIN/"
