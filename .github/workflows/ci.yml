name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64, vane-ci]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vane_test
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
        env:
          DATABASE_URL: postgres://vane:vane_test@localhost:5432/vane_test?sslmode=disable

      - name: Build
        run: go build -o bin/vane ./cmd/server

  deploy:
    needs: test
    runs-on: [self-hosted, Linux, ARM64, vane-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # 串行化对同一台 VPS 的部署。无此 group 时，相近时间 push main（如一个 release
    # commit + 一个 fix PR）会并行跑两个 deploy，各自 scp 二进制 + restart vane，谁晚
    # 完成谁覆盖、与 git 顺序无关，可能静默把旧二进制推上线（2026-07-17 PR #49 与
    # v0.5.1 并发的真实隐患：靠 #49 恰好晚 1m24s 完成才侥幸上对版本）。放在 job 级只
    # 串行部署、不碰 PR test 的并发度。cancel-in-progress: false：不打断正在 restart
    # 的部署（半路取消可能留下半吊子状态）；排队时新 pending 会取代旧 pending，故最终
    # 仍以最新 main 为准。
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"

      # 四个二进制都要上生产：
      #   vane         —— 主服务
      #   useradmin    —— 账号管理（**部署 D2′ 认证后必须有它**，否则 owner 接管不了
      #                    账号，Dashboard 直接登不进去且无法自救）
      #   gate         —— Gate 探针（下方「Gate probes」post-deploy 步骤执行它，
      #                    红灯打红流水线——2026-07-20 拍板接线）
      #   runtimeadmin —— Runtime 管理工具（C2c baseline 的 dry-run/apply/verify 唯一入口）
      - name: Build linux binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/vane ./cmd/server
          GOOS=linux GOARCH=amd64 go build -o bin/useradmin ./cmd/useradmin
          GOOS=linux GOARCH=amd64 go build -o bin/gate ./cmd/gate
          GOOS=linux GOARCH=amd64 go build -o bin/runtimeadmin ./cmd/runtimeadmin
        env:
          CGO_ENABLED: "0"

      - name: Prepare directories
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/vane/bin

      - name: Upload binary
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bin/vane,bin/useradmin,bin/gate,bin/runtimeadmin"
          target: "/opt/vane/"

      # 基础设施文件（Caddyfile / compose / systemd unit / dynamicconfig）随代码同步。
      # 缺这步会导致：改了 Caddyfile 或 compose 后 VPS 仍跑旧配置——M2 前端 404 即因此
      # （前端产物已就位但 Caddy 未挂 web 卷、Caddyfile 未更新）。strip_components 去掉 deploy/ 前缀。
      - name: Upload infra files
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/Caddyfile,deploy/docker-compose.yml,deploy/vane.service,deploy/dynamicconfig/development-sql.yaml"
          target: "/opt/vane/"
          strip_components: 1

      - name: Apply infra changes
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cp /opt/vane/vane.service /etc/systemd/system/vane.service
            systemctl daemon-reload
            # compose 幂等：service 定义或卷有变更才重建，无变更是 no-op
            cd /opt/vane && docker compose up -d
            # Caddyfile 是单文件 bind mount，按 inode 钉死：scp 替换文件会换 inode，
            # 此后容器里永远是旧内容——reload 会"成功"地重载旧文件，|| 兜底因 reload
            # 不报错而永不触发，且 docker restart 本就不刷新 bind mount，三层全静默
            # （2026-07-18 主域 well-known 悬空 3 天的根因）。
            # 判据直接比内容：容器视图 ≠ 宿主机文件 ⇒ mount 已脱钩 ⇒ 唯有重建容器能重新挂载。
            if docker exec vane-caddy-1 cat /etc/caddy/Caddyfile | cmp -s - /opt/vane/Caddyfile; then
              docker exec vane-caddy-1 caddy reload --config /etc/caddy/Caddyfile
            else
              docker compose up -d --force-recreate caddy
            fi

      - name: Restart and verify
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            chmod +x /opt/vane/bin/vane /opt/vane/bin/useradmin /opt/vane/bin/gate /opt/vane/bin/runtimeadmin
            test -x /opt/vane/bin/runtimeadmin

            # Migration 047 installs the cross-version writer fence. The old worker must
            # therefore finish its own graceful shutdown before the new binary is allowed
            # to start and migrate. A missing proof is a hard failure: because `start` is
            # below every assertion, the unit stays stopped for operator inspection.
            if systemctl is-active --quiet vane; then
              old_invocation=$(systemctl show vane --property=InvocationID --value)
              # Use journalctl's timezone-independent Unix timestamp syntax.
              # The production journalctl rejects RFC3339 offsets with a colon
              # (for example -04:00), even though GNU date emits that form.
              drain_started_at=$(date +%s)
              test -n "$old_invocation"
              echo "draining old vane invocation=$old_invocation started_at=$drain_started_at"

              systemctl stop vane

              stopped_state=$(systemctl is-active vane || true)
              if [ "$stopped_state" != "inactive" ]; then
                echo "old vane invocation did not become inactive (state=$stopped_state)" >&2
                exit 1
              fi

              old_invocation_log=$(journalctl "_SYSTEMD_INVOCATION_ID=$old_invocation" --no-pager -o cat)
              if ! grep -Fq "关停完成" <<<"$old_invocation_log"; then
                echo "old vane invocation has no application graceful-shutdown proof" >&2
                exit 1
              fi

              stop_log=$(journalctl -u vane --since "@$drain_started_at" --no-pager -o cat)
              if grep -Eiq \
                "(stop-sigterm.*timed out|timed out.*killing|signal SIGKILL|status=9/KILL|code=killed.*KILL)" \
                <<<"$old_invocation_log"$'\n'"$stop_log"; then
                echo "old vane invocation hit a stop timeout or SIGKILL" >&2
                exit 1
              fi
            else
              # First installation (or an intentionally pre-stopped unit) has no old
              # invocation to prove. It must still be inactive and process-free.
              stopped_state=$(systemctl is-active vane || true)
              if [ "$stopped_state" != "inactive" ]; then
                echo "vane has no active invocation but is not inactive (state=$stopped_state)" >&2
                exit 1
              fi
              echo "no active vane invocation; skipping old-journal drain proof"
            fi

            leftover_pids=""
            for process_exe in /proc/[0-9]*/exe; do
              executable=$(readlink "$process_exe" 2>/dev/null || true)
              case "$executable" in
                "/opt/vane/bin/vane"|"/opt/vane/bin/vane (deleted)")
                  pid=${process_exe#/proc/}
                  pid=${pid%/exe}
                  leftover_pids="$leftover_pids $pid"
                  ;;
              esac
            done
            if [ -n "$leftover_pids" ]; then
              echo "old /opt/vane/bin/vane processes remain:$leftover_pids" >&2
              exit 1
            fi

            echo "old vane worker drain verified; starting roll-forward binary"
            systemctl start vane
            # Type=simple 下 restart 立即返回，必须主动验证：
            # 迁移失败/配置缺失会崩溃重启循环，没有这步 CI 会假绿。
            sleep 5
            systemctl is-active vane
            curl -fsS --max-time 5 http://127.0.0.1:8080/readyz
            # 主域 well-known 验证：终点必须是后端应答的 json（-L 跟随重定向——
            # 前端迁 OSS+CDN 后主域此路径按拍板 302 到 api 子域，跟完仍应是 json；
            # 迁移前 Caddy 直接反代后端，同样是 json）。返回 SPA html ⇒ 路由断了要响。
            ctype=$(curl -sSL -o /dev/null -w '%{content_type}' --max-time 10 https://vane.zhuoqidev.com/.well-known/agent-card.json)
            case "$ctype" in *json*) : ;; *) echo "主域 well-known 终点不是 json（$ctype），well-known 路由断了"; exit 1;; esac
            echo "deploy verified: readyz OK"

      # Gate 探针 post-deploy 验证（Boss 2026-07-20 拍板接线）：部署完成后在 VPS 上跑一轮
      # M5 契约 §16 全量探针。红灯（exit 1）或探针自身跑不动（exit 2，此刻线上健康是盲区，
      # 比红灯更危险）都让本 job 红。语义是"部署已生效但体检不过"：服务已在跑新代码、
      # 无自动回滚，流水线红是给人的强信号，与 probewatch 的飞书告警卡双通道。
      # 黄灯不阻断（exit 0——数据不足/需人工确认，部署当天几乎必然有黄，见 cmd/gate 头注释）。
      # 窗口 24h 覆盖部署前数据是刻意语义："上一版制造的红灯"不该被下一次部署静默滚过。
      - name: Gate probes
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /opt/vane/bin/gate -env /opt/vane/.env
