name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # 双线部署（M7，2026-07-18 起）：与主站 zhuoqidev.com 同款模式——
  #   国内线：DNS default 线路 → 阿里 CDN → OSS（zhuoqidev-vane-web，私有桶+oss_auth 回源）
  #   境外线：DNS oversea 线路 → Cloudflare Pages（vane-web.pages.dev）
  # 生产构建注入 VITE_API_BASE（静态托管与 API 不同源，后端 CORS 见 vane#54）。
  # scp 到 VPS 为过渡期保留（DNS 未切/回滚时 Caddy 仍能服务），切流验证通过后移除。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # 串行化部署（vane 仓库 deploy-vps 同理）：并行的两次 push 谁晚完成谁覆盖，
    # 与 git 顺序无关，可能把旧构建静默推上线。
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 绝对 API 基址：三个部署目标（CDN/Pages/VPS）都用同一份产物，
          # 跨源由后端 CORS 放行；本地 dev 不设此变量走 vite 代理。
          VITE_API_BASE: https://api.vane.zhuoqidev.com

      - name: Install aliyun CLI
        run: |
          # release 资产名含版本号（无 latest 别名），从 API 取真实下载地址
          url=$(curl -fsSL https://api.github.com/repos/aliyun/aliyun-cli/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-.*-amd64\\.tgz$")) | .browser_download_url')
          curl -fsSL -o /tmp/aliyun.tgz "$url"
          tar -xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun

      - name: Deploy OSS + 刷新 CDN（国内线）
        run: |
          aliyun configure set --profile default --mode AK \
            --access-key-id "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" \
            --region cn-shenzhen
          # sync --delete = 镜像语义：清掉桶里已不在 dist 的旧 hash 产物
          # （与下方 VPS "先清空再传"同一个卫生要求）
          aliyun oss sync dist/ oss://zhuoqidev-vane-web/ --delete --force
          # index.html 无 hash 会被边缘缓存，必须主动刷新目录让新版立即生效
          aliyun cdn RefreshObjectCaches --ObjectPath "https://vane.zhuoqidev.com/" --ObjectType Directory

      - name: Deploy Cloudflare Pages（境外线）
        run: npx --yes wrangler@4 pages deploy dist --project-name vane-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ——以下 VPS scp 为过渡期保留（DNS 未切流/回滚场景），切流验证后移除——
      # 先清空再传：避免旧构建的 hash 文件无限堆积、以及删除页面后残留可访问
      - name: Prepare web directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/vane/web
            # 只清目录内容不删目录本身，Caddy 容器挂载的是该目录的 inode
            find /opt/vane/web -mindepth 1 -delete

      # strip_components: 1 去掉 dist/ 前缀，确保落盘为 /opt/vane/web/index.html
      # 而不是 /opt/vane/web/dist/index.html（scp-action 内部走 tar，支持该参数）
      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/opt/vane/web"
          strip_components: 1

      - name: Verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 部署后必须能直接看到 index.html，否则说明前缀/路径出了问题，CI 该红就红
            test -f /opt/vane/web/index.html
            echo "deploy verified: /opt/vane/web/index.html present"
