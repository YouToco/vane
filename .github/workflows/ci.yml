name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # M7 时接入部署：
  #   deploy-oss:   aliyun CLI 上传 dist/ 到 OSS + CDN 刷新（国内线路）
  #   deploy-pages: wrangler pages deploy dist/（境外线路）
