name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # 双线部署（M7，2026-07-18 切流，Boss 浏览器验收通过）：与主站 zhuoqidev.com 同款模式——
  #   国内线：DNS default 线路 → 阿里 CDN → OSS（zhuoqidev-vane-web，public-read）
  #   境外线：DNS oversea 线路 → Cloudflare Pages（vane-web.pages.dev）
  # 生产构建注入 VITE_API_BASE（静态托管与 API 不同源，后端 CORS 见 vane#54）。
  # VPS scp 兜底已随验收移除（回滚路径见 vane 仓 deploy/Caddyfile 头注释）。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # 串行化部署（vane 仓库 deploy-vps 同理）：并行的两次 push 谁晚完成谁覆盖，
    # 与 git 顺序无关，可能把旧构建静默推上线。
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 绝对 API 基址：两线（CDN/Pages）用同一份产物，跨源由后端 CORS 放行；
          # 本地 dev 不设此变量走 vite 代理。
          VITE_API_BASE: https://api.vane.zhuoqidev.com

      - name: Install aliyun CLI
        run: |
          # release 资产名含版本号（无 latest 别名），从 API 取真实下载地址
          url=$(curl -fsSL https://api.github.com/repos/aliyun/aliyun-cli/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-.*-amd64\\.tgz$")) | .browser_download_url')
          curl -fsSL -o /tmp/aliyun.tgz "$url"
          tar -xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun

      - name: Deploy OSS + 刷新 CDN（国内线）
        run: |
          aliyun configure set --profile default --mode AK \
            --access-key-id "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" \
            --region cn-shenzhen
          # sync --delete = 镜像语义：清掉桶里已不在 dist 的旧 hash 产物
          aliyun oss sync dist/ oss://zhuoqidev-vane-web/ --delete --force
          # index.html 无 hash 会被边缘缓存，必须主动刷新目录让新版立即生效
          aliyun cdn RefreshObjectCaches --ObjectPath "https://vane.zhuoqidev.com/" --ObjectType Directory

      - name: Deploy Cloudflare Pages（境外线）
        run: npx --yes wrangler@4 pages deploy dist --project-name vane-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
