name: Control plane CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

env:
  GOSUMDB: sum.golang.org

jobs:
  test:
    # PR-controlled code must not execute in the trusted exact-main build VM.
    # Exact-main push/schedule runs may use vane-build, avoiding a vane-test
    # outage becoming a production control-plane single point of failure.
    runs-on: >-
      ${{
        fromJSON(
          github.event_name == 'pull_request'
          && '["self-hosted","Linux","ARM64","vane-test"]'
          || '["self-hosted","Linux","ARM64","vane-build"]'
        )
      }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache: false
          go-version: "1.26.5"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1

      - name: Wrangler vulnerability scan
        run: npm --prefix tools/wrangler audit --audit-level=high

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Python tests
        run: |
          python3 -m py_compile scripts/artifact.py
          python3 -m unittest discover -s tests -v

      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Generated files remain unchanged
        run: git diff --exit-code
