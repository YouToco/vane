name: Control plane CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

env:
  GOSUMDB: sum.golang.org

jobs:
  hosted-runner-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify clean x64 build substrate is available
        run: |
          set -euo pipefail
          [[ $(uname -s) == Linux ]]
          [[ $(uname -m) == x86_64 ]]
          docker version --format '{{.Server.Arch}}' | grep -Fx amd64

  test:
    # PR-controlled code stays on the isolated vane-test role. Exact-main
    # push/schedule checks use a fresh GitHub-hosted VM so a sleeping or failed
    # persistent build host cannot block the production control plane.
    runs-on: >-
      ${{
        fromJSON(
          github.event_name == 'pull_request'
          && '["self-hosted","Linux","vane-test"]'
          || '"ubuntu-24.04"'
        )
      }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache: false
          go-version: "1.26.5"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1

      - name: Wrangler vulnerability scan
        run: npm --prefix tools/wrangler audit --audit-level=high

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Python tests
        run: |
          python3 -m py_compile scripts/artifact.py
          python3 -m unittest discover -s tests -v

      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Generated files remain unchanged
        run: git diff --exit-code
