name: Control plane CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64, vane-build]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Python tests
        run: |
          python3 -m py_compile scripts/artifact.py
          python3 -m unittest discover -s tests -v

      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Generated files remain unchanged
        run: git diff --exit-code
