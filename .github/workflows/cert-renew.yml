name: Renew CDN certificate

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vane-production-control-plane
  cancel-in-progress: false

jobs:
  renew:
    runs-on: [self-hosted, Linux, ARM64, vane-deploy]
    timeout-minutes: 30

    steps:
      - name: Checkout deployment control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Aliyun CLI
        run: scripts/install-aliyun.sh

      - name: Renew and publish certificate
        env:
          ALIYUN_BIN: ${{ runner.temp }}/aliyun-3.4.8/aliyun
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ACME_ACCOUNT_EMAIL: ${{ secrets.ACME_ACCOUNT_EMAIL }}
        run: scripts/renew-cert.sh
