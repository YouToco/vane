# vane.zhuoqidev.com 的阿里 CDN 证书续期（国内线）。
#
# 为什么存在：CAS 免费证书额度不足（2026-07-18 实测 InsufficientQuota），国内线 CDN
# 证书改用 Let's Encrypt（acme.sh + alidns DNS-01，首签 2026-07-18 Mac 手工完成）。
# LE 有效期 90 天，每月强制重签一次并上传 CDN，留 ~2 个月冗余；连续两次失败仍在
# 有效期内，有修复窗口。境外线（Cloudflare Pages）的边缘证书由 CF 自动管理，与此无关。
#
# DNS-01 验证走 alidns API（同账号），与 DNS 是否已切流无关，随时可跑。
name: Renew CDN cert

on:
  schedule:
    - cron: "0 3 1 * *" # 每月 1 日 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: [self-hosted, Linux, ARM64, vane-deploy]
    environment: production
    steps:
      - name: Issue cert (acme.sh + alidns DNS-01)
        run: |
          acme_source=$(mktemp -d)
          trap 'rm -rf "$acme_source"' EXIT
          acme_commit=3661fd86b6304115e42f43910e6dd452ab9866d6
          git clone --depth 1 --branch 3.1.4 --single-branch \
            https://github.com/acmesh-official/acme.sh.git "$acme_source"
          [ "$(git -C "$acme_source" rev-parse HEAD)" = "$acme_commit" ] || {
            echo "acme.sh 3.1.4 did not resolve to pinned commit $acme_commit"
            exit 1
          }
          "$acme_source/acme.sh" --install -m Liuzhuoqi147@gmail.com
          export Ali_Key="${{ secrets.ALIYUN_ACCESS_KEY_ID }}"
          export Ali_Secret="${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}"
          ~/.acme.sh/acme.sh --issue --dns dns_ali -d vane.zhuoqidev.com --server letsencrypt --force

      - name: Upload to Aliyun CDN
        run: |
          # release 资产名含版本号（无 latest 别名），从 API 取真实下载地址（同 ci.yml）。
          # 必须带 token：匿名配额按 runner 共享 IP 计，曾被 403 限流（2026-07-19，ci.yml 同修）。
          url=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/aliyun/aliyun-cli/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-.*-arm64\\.tgz$")) | .browser_download_url')
          [ -n "$url" ] || { echo "GitHub API 未解析出下载地址（限流或资产命名变更）"; exit 1; }
          curl -fsSL -o /tmp/aliyun.tgz "$url"
          tar -xzf /tmp/aliyun.tgz -C /tmp && sudo mv /tmp/aliyun /usr/local/bin/aliyun
          aliyun configure set --profile default --mode AK \
            --access-key-id "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" \
            --region cn-shenzhen
          aliyun cdn SetCdnDomainSSLCertificate --DomainName vane.zhuoqidev.com \
            --SSLProtocol on --CertType upload \
            --CertName "vane-le-$(date +%Y%m%d)" \
            --SSLPub "$(cat "$HOME/.acme.sh/vane.zhuoqidev.com_ecc/fullchain.cer")" \
            --SSLPri "$(cat "$HOME/.acme.sh/vane.zhuoqidev.com_ecc/vane.zhuoqidev.com.key")"

      - name: Verify cert live
        run: |
          # 给边缘一点下发时间后核对证书到期日必须在 60 天以上
          sleep 120
          end=$(echo | openssl s_client -servername vane.zhuoqidev.com \
            -connect vane.zhuoqidev.com.w.kunlunaq.com:443 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          echo "edge cert notAfter: $end"
          exp=$(date -d "$end" +%s); now=$(date +%s)
          [ $(( (exp - now) / 86400 )) -ge 60 ] || { echo "边缘证书剩余不足 60 天，续期未生效"; exit 1; }
